[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "muse-airi-bridge"
version = "0.1.0"
description = "A local OpenAI Chat Completions bridge from AIRI to your existing Muse agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.5,<1",
    "uvicorn>=0.32.1,<1",
    "pydantic>=2.10,<3",
    "muse-cli==0.3.10",
]

[project.scripts]
muse-airi-bridge = "muse_airi_bridge.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/muse_airi_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
